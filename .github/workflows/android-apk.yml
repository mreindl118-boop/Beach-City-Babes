name: Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Assemble web assets
        run: |
          mkdir -p www
          cp -r index.html css js icons manifest.webmanifest sw.js version.json www/

      - name: Generate Capacitor Android project
        run: |
          npm install --no-save @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap add android
          npx cap sync android

      - name: Apply the peach app icon
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            dir=android/app/src/main/res/mipmap-${d%%:*}
            size=${d##*:}
            convert icons/icon-512.png -resize ${size}x${size} "$dir/ic_launcher.png"
            convert icons/icon-512.png -resize ${size}x${size} "$dir/ic_launcher_round.png"
            convert icons/icon-maskable-512.png -resize ${size}x${size} "$dir/ic_launcher_foreground.png" || true
          done
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml \
                android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Wire the committed stable debug keystore into Gradle
        # Every CI run otherwise generates a throwaway debug keystore, so each
        # release got a DIFFERENT signature under the same package id and Android
        # refused to update-install over the last one ("App not installed").
        # Merely dropping the keystore at ~/.android/debug.keystore did NOT work —
        # the Capacitor project doesn't read that path. So point the debug
        # signingConfig explicitly at our committed keystore. A second `android {}`
        # block is legal Groovy and merges, reconfiguring the existing debug
        # signingConfig. Now every build shares one signature forever.
        run: |
          cp android-signing/bcb-debug.keystore android/app/bcb-debug.keystore
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  debug {
                      storeFile file("bcb-debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.debug
                  }
              }
          }
          GRADLE

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Read game version
        id: ver
        run: echo "ver=$(python3 -c 'import json;print(json.load(open("version.json"))["version"])')" >> "$GITHUB_OUTPUT"

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "BeachCityBabes-v${{ steps.ver.outputs.ver }}-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: BeachCityBabes-debug-apk
          path: '*.apk'

      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.ver }}
          target_commitish: ${{ github.sha }}
          files: '*.apk'
          prerelease: true
          body: |
            🍑 **Beach City Babes — alpha APK (debug build)**

            Install on Android: download the APK below, open it, and allow
            "install from unknown sources" when prompted. 18+ only.

            ⚠️ **Upgrading from v0.7.0-alpha or earlier?** Those builds were each
            signed with a different throwaway key, so Android will show
            "App not installed" if you try to install over them. **Uninstall the
            old Beach City Babes once**, then install this APK. From this release
            onward every build shares one stable signature, so future updates
            install straight over the top with no uninstall.

            This is a debug-signed alpha — expect rough edges. The web/PWA
            version at the repo README always has the newest build.
