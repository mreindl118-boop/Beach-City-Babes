<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ff5d8f">
  <title>Beach City Babes 🍑</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ============ TITLE ============ -->
  <section id="title-screen" class="screen">
    <div id="title-scene" aria-hidden="true">
      <svg id="ts-sky" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMax slice">
        <defs>
          <linearGradient id="ts-grad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#2b1a4e">
              <animate attributeName="stop-color" values="#ff9e6d;#c05a86;#2b1a4e;#c05a86;#ff9e6d" dur="26s" repeatCount="indefinite"/>
            </stop>
            <stop offset="58%" stop-color="#ff6a88">
              <animate attributeName="stop-color" values="#ffd27f;#ff6a88;#5b3a7e;#ff6a88;#ffd27f" dur="26s" repeatCount="indefinite"/>
            </stop>
            <stop offset="100%" stop-color="#ffb199">
              <animate attributeName="stop-color" values="#ffe9a8;#ffb199;#8a4a7a;#ffb199;#ffe9a8" dur="26s" repeatCount="indefinite"/>
            </stop>
          </linearGradient>
          <radialGradient id="ts-sunglow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ffd166" stop-opacity="0.9"/>
            <stop offset="100%" stop-color="#ffd166" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <rect width="1440" height="900" fill="url(#ts-grad)"/>
        <g class="ts-sun">
          <circle cx="720" cy="560" r="150" fill="url(#ts-sunglow)"/>
          <circle cx="720" cy="560" r="74" fill="#ffd166"/>
        </g>
        <g class="ts-sea">
          <path class="ts-wave w1" d="M-200 640 Q-100 620 0 640 T200 640 T400 640 T600 640 T800 640 T1000 640 T1200 640 T1400 640 T1600 640 T1800 640 V900 H-200 Z" fill="#3f5f9e" opacity="0.85"/>
          <path class="ts-wave w2" d="M-200 668 Q-80 648 40 668 T280 668 T520 668 T760 668 T1000 668 T1240 668 T1480 668 T1720 668 V900 H-200 Z" fill="#2a4a86" opacity="0.9"/>
        </g>
        <path d="M0 790 Q400 742 720 768 T1440 776 V900 H0 Z" fill="#f2c98f"/>
        <g class="ts-palm pl">
          <path d="M120 900 C130 790 118 720 138 660 L154 664 C138 726 152 792 166 900 Z" fill="#3a2350"/>
          <g fill="#472a62">
            <path d="M146 664 C90 620 40 626 6 664 C66 652 108 660 146 676 Z"/>
            <path d="M146 662 C120 596 76 570 26 574 C84 596 118 626 148 674 Z"/>
            <path d="M146 662 C176 596 226 578 278 588 C216 604 178 632 148 674 Z"/>
            <path d="M148 664 C206 626 258 630 292 664 C232 654 188 660 150 676 Z"/>
          </g>
        </g>
        <g class="ts-palm pr">
          <path d="M1320 900 C1310 800 1322 736 1302 682 L1286 686 C1302 742 1290 804 1274 900 Z" fill="#3a2350"/>
          <g fill="#472a62">
            <path d="M1294 686 C1350 646 1398 650 1432 684 C1374 674 1332 680 1294 698 Z"/>
            <path d="M1294 684 C1320 622 1362 598 1410 602 C1354 622 1322 650 1292 696 Z"/>
            <path d="M1294 684 C1264 622 1216 604 1166 612 C1226 628 1262 654 1292 696 Z"/>
          </g>
        </g>
      </svg>
      <div id="title-sparkles"></div>
      <div id="title-babes"><div id="tb-l"></div><div id="tb-r"></div></div>
    </div>
    <div class="title-inner">
      <div class="logo">🍑</div>
      <h1 class="shimmer">Beach City <span>Babes</span></h1>
      <p class="tagline">a procedural summer of flirting dangerously</p>

      <div id="age-gate" class="panel">
        <p>This game contains flirting, innuendo, and scandalous swimwear.<br><b>Are you 18 or older?</b></p>
        <button class="btn primary" id="age-yes">I’m 18+ — let me in 😎</button>
      </div>

      <div id="title-main" class="hidden">
        <div id="slot-list"></div>
      </div>
    </div>
  </section>

  <!-- ============ CHARACTER CREATOR ============ -->
  <section id="creator-screen" class="screen hidden">
    <div class="creator-inner">
      <h2>Who arrives in Beach City?</h2>

      <label class="cc-label">Name</label>
      <input id="cc-name" maxlength="16" placeholder="Alex" autocomplete="off">

      <label class="cc-label">Gender</label>
      <div id="cc-genders" class="chip-row"></div>
      <div id="cc-trans" class="chip-row"></div>

      <label class="cc-label">Pronouns</label>
      <div id="cc-pronouns" class="chip-row"></div>

      <label class="cc-label">Your role this summer <span class="cc-hint">— some babes will love it, some won’t</span></label>
      <div id="cc-roles"></div>

      <div class="creator-btns">
        <button class="btn" id="cc-back">← Back</button>
        <button class="btn primary" id="cc-go">🌅 Start the summer</button>
      </div>
    </div>
  </section>

  <!-- ============ GAME ============ -->
  <section id="game-screen" class="screen hidden">
    <header id="topbar">
      <span id="coins">🪙 0</span>
      <span id="daytime">☀️ Day 1 · 9:00</span>
      <span id="hearts-won">💛 0</span>
      <span id="stats-strip" class="stats-strip"></span>
      <span class="grow"></span>
      <button class="iconbtn" id="btn-texts">📱<span id="texts-badge" class="badge hidden">0</span></button>
      <button class="iconbtn" id="btn-menu">☰</button>
    </header>

    <main id="main">
      <div id="char-panel">
        <div id="portrait-box"></div>
        <div id="char-name" class="char-name"></div>
        <div id="char-chips" class="chips"></div>
        <div id="tier-track" class="tier-track"></div>
        <div class="meters">
          <div class="meter" id="meter-aff">
            <span class="mlabel"><span class="mi">♥</span> Affection</span>
            <div class="bar"><div class="fill aff"></div></div><span class="val">0</span>
          </div>
          <div class="meter" id="meter-des">
            <span class="mlabel"><span class="mi">🔥</span> Desire</span>
            <div class="bar"><div class="fill des"></div></div><span class="val">0</span>
          </div>
          <div class="mood">mood <span id="mood-emoji">😐</span> <span id="spark" class="spark"></span></div>
        </div>
        <div id="profile"></div>
        <button class="btn finale hidden" id="btn-finale">🔥💘 Invite to the Bonfire 💘🔥</button>
      </div>

      <div id="chat-panel">
        <div id="chat-banner"></div>
        <div id="chat-log"></div>
        <div id="choices"></div>
        <div id="chat-chips"></div>
        <form id="chat-bar" autocomplete="off">
          <input id="chat-input" type="text" maxlength="240" placeholder="Say something to them…" aria-label="Type a message">
          <button id="chat-send" type="submit" class="btn primary">Send</button>
        </form>
        <nav id="actions">
          <button class="btn act" data-action="gift" data-cat="love"><span class="ai">🎁</span><span class="al">Gift</span></button>
          <button class="btn act" data-action="date" data-cat="love"><span class="ai">💋</span><span class="al">Date</span></button>
          <button class="btn act" data-action="phone" data-cat="comm"><span class="ai">📱</span><span class="al">Phone</span></button>
          <button class="btn act" data-action="roster" data-cat="comm"><span class="ai">💞</span><span class="al">People</span></button>
          <button class="btn act" data-action="hustle" data-cat="coin"><span class="ai">💼</span><span class="al">Hustle</span></button>
          <button class="btn act" data-action="items" data-cat="coin"><span class="ai">🎒</span><span class="al">Items</span></button>
          <button class="btn act" data-action="here" data-cat="world"><span class="ai">📍</span><span class="al">Here</span></button>
          <button class="btn act" data-action="travel" data-cat="world"><span class="ai">🗺️</span><span class="al">Travel</span></button>
          <button class="btn act" data-action="sleep" data-cat="rest"><span class="ai">😴</span><span class="al">Sleep</span></button>
        </nav>
      </div>
    </main>
  </section>

  <!-- overlays -->
  <div id="modal" class="hidden"><div id="modal-body" class="panel"></div></div>
  <div id="finale-overlay" class="hidden"></div>
  <div id="toast" class="hidden"></div>

  <script type="module" src="js/game.js"></script>
</body>
</html>
